<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Go Studio Dev</title>
  <style>
    :root { --bg: #fafafa; --text: #1a1a1a; --text2: #555; --accent: #0066ff; --border: #e5e5e5; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111; --text: #f0f0f0; --text2: #999; --accent: #4d94ff; --border: #2a2a2a; } }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; -webkit-font-smoothing: antialiased; }
    .container { text-align: center; padding: 24px; }
    h1 { font-size: 28px; font-weight: 700; margin-bottom: 12px; }
    p { color: var(--text2); margin-bottom: 32px; }
    a { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 18px; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Go Studio Dev</h1>
    <p>Apps crafted with care.</p>
    <a href="/pdfbench/">PDFBench &rarr;</a>
  </div>
</body>
</html>
